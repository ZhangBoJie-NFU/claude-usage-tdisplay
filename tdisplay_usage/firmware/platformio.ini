; LILYGO T-Display V1.1 (ESP32 + ST7789 135x240) - Claude Code usage display
;
; Build and flash:   pio run -t upload
; Serial monitor:    pio device monitor

[env:tdisplay]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Fixed board port (auto-detect may pick the wrong one if the PC has other CH34x / CP210x devices).
; Change it to your serial port, or delete these two lines to let PlatformIO auto-detect
upload_port = COM3
monitor_port = COM3
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
; TFT_eSPI pin setup (same as User_Setups/Setup25_TTGO_T_Display.h); defining it here
; means the library's User_Setup.h does not need to be edited
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
