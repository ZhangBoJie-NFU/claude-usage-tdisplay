; LILYGO T-Display V1.1 (ESP32 + ST7789 135x240) - Claude Code 用量顯示
;
; 編譯並燒錄:  pio run -t upload
; 看序列輸出:  pio device monitor

[env:tdisplay]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; 固定用開發板的埠（電腦上有其他 CH34x / CP210x 裝置時自動偵測可能選錯）。
; 請改成你的序列埠，或刪掉這兩行讓 PlatformIO 自動偵測
upload_port = COM3
monitor_port = COM3
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
; TFT_eSPI 的腳位設定（等同 User_Setups/Setup25_TTGO_T_Display.h），
; 寫在這裡就不必修改函式庫裡的 User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
